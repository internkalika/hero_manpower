<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ludhiana Manpower Analysis</title>
<style>
:root[data-theme=light]{--hov:#fde8e9;--bg:#f3f4f6;--p1:#ffffff;--p2:#eceef2;--ln:#d6d9df;--tx:#15151a;--mt:#596070;--red:#d0232a;--red2:#c4161d;--amb:#d98a00;--grn:#12934f;--blu:#1f78e0;--pur:#7c4ddb}:root{--hov:#2a1214;--bg:#09090b;--p1:#131316;--p2:#1b1b20;--ln:#2a2a31;--tx:#f4f4f5;--mt:#a1a1aa;--red:#e1262d;--red2:#ff5a5f;--amb:#f5a623;--grn:#2fbf71;--blu:#3b9cff;--pur:#a78bfa;--cy:#22d3ee}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",system-ui,Arial,sans-serif}
body{min-height:100vh}
#top{position:fixed;top:0;left:0;right:0;height:58px;z-index:30;background:var(--p1);border-bottom:2px solid var(--red);display:flex;align-items:center;gap:14px;padding:0 18px}
#top img{height:34px}#top .t{font-size:18px;font-weight:700;letter-spacing:.2px}#top .s{font-size:11.5px;color:var(--mt)}#top .sp{flex:1}
.btn{background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:7px 13px;cursor:pointer;font:inherit;font-weight:600;display:inline-flex;gap:7px;align-items:center}.btn:hover{border-color:var(--red)}
.menu{position:relative}.menu .dd{display:none;position:absolute;right:0;top:40px;background:var(--p1);border:1px solid var(--ln);border-radius:8px;min-width:230px;box-shadow:0 8px 24px #0006;overflow:hidden}.menu.on .dd{display:block}.menu .dd button{display:block;width:100%;text-align:left;background:transparent;color:var(--tx);border:0;padding:10px 14px;cursor:pointer;font:inherit}.menu .dd button:hover{background:var(--p2)}
header{position:fixed;left:0;top:58px;bottom:0;width:210px;z-index:20;background:var(--p1);border-right:1px solid var(--ln);padding:14px 10px}
nav{display:flex;flex-direction:column;gap:4px;width:100%}
nav button{background:transparent;color:var(--mt);border:0;border-left:3px solid transparent;padding:10px 12px;border-radius:6px;cursor:pointer;font:inherit;font-weight:600;text-align:left}
nav button:hover{color:var(--tx);background:var(--p2)}nav button.on{background:var(--p2);color:var(--tx);border-left-color:var(--red)}
main{margin-left:210px;margin-top:58px}
@media(max-width:800px){header{position:static;width:auto;margin-top:58px;border-right:0}nav{flex-direction:row;flex-wrap:wrap}main{margin-left:0;margin-top:0}#top .s{display:none}#top{flex-wrap:wrap;height:auto;padding:6px 12px}}
main{padding:14px 22px 60px}.c3{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}@media(max-width:800px){.c3{grid-template-columns:1fr}}.flow{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}.fb{flex:1;min-width:150px;background:var(--p1);border:1px solid var(--ln);border-top:4px solid var(--c);border-radius:10px;padding:10px 12px;cursor:pointer;transition:.15s}.fb:hover{border-color:var(--c);transform:translateY(-2px)}.fl{font-size:11.5px;color:var(--mt);font-weight:600}.fn{font-size:24px;font-weight:800;margin:3px 0}.fs{font-size:11.5px;color:var(--mt)}.ar{align-self:center;font-size:20px;color:var(--mt)}.pnote{font-size:12px;color:var(--mt);margin:4px 0 0}.per{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mt)}.per input,.per select{padding:5px 8px;font-size:12.5px}.big{font-size:44px;font-weight:800;line-height:1}.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;color:#000;background:var(--c)}.donutw{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}.row2{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:center;padding:4px;border-radius:6px;cursor:pointer;font-size:12.5px}.row2:hover{background:var(--hov)}.pb{position:relative;height:20px;background:var(--p2);border:1px solid var(--ln);border-radius:4px}.pb i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}.pb b{position:absolute;right:6px;top:1px;font-size:11.5px}
h2{margin:26px 0 4px;font-size:18px;display:flex;align-items:center;gap:10px}h2:before{content:"";width:5px;height:18px;background:var(--red);border-radius:2px}
.how{display:none}.how b{color:var(--tx)}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(440px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--p1);border:1px solid var(--ln);border-radius:10px;padding:14px;position:relative;overflow:hidden}
.card h3{margin:0 0 2px;font-size:14px}.card .sub{color:var(--mt);font-size:12px;margin-bottom:8px}
.clk{cursor:pointer;transition:.15s}.clk:hover{border-color:var(--red);transform:translateY(-1px);box-shadow:0 4px 18px #e1262d33}
.kpi .lb{color:var(--mt);font-size:12px;text-transform:uppercase;letter-spacing:.6px}.kpi .v{font-size:30px;font-weight:800;margin:4px 0}.kpi .d{font-size:12px;color:var(--mt)}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--red))}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--c,#333);color:#000}
.hint{position:absolute;right:10px;top:8px;font-size:10.5px;color:var(--mt)}.hint:after{content:" ›"}
table{border-collapse:collapse;width:100%;font-size:12.5px}th{background:var(--p2);text-align:left;padding:7px 8px;position:sticky;top:0;color:var(--tx);font-weight:600;white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--ln)}tr.r{cursor:pointer}tr.r:hover td{background:var(--hov)}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{max-height:430px;overflow:auto;border:1px solid var(--ln);border-radius:8px}
.hb{display:grid;grid-template-columns:150px 1fr 92px;gap:8px;align-items:center;padding:3px 4px;border-radius:6px;cursor:pointer;font-size:12.5px}.hb:hover{background:var(--hov)}
.hb .bar{height:15px;background:var(--p2);border-radius:4px;overflow:hidden;position:relative}.hb .bar i{display:block;height:100%;border-radius:4px}
.hb .val{text-align:right;font-variant-numeric:tabular-nums}
select,input{background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:6px 9px;font:inherit}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:7px;overflow:hidden}.seg button{background:var(--p2);color:var(--mt);border:0;padding:6px 12px;cursor:pointer;font:inherit}.seg button.on{background:var(--red);color:#fff}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0 12px}
svg text{fill:var(--mt);font-size:10.5px}svg .pt{cursor:pointer}svg .pt:hover{r:7}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mt);margin:6px 0}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.heat td{padding:0;text-align:center;font-size:10.5px;height:26px;min-width:44px;border:1px solid #0b0b0d;cursor:pointer;color:#000;font-weight:600}.heat td.l{background:var(--p1);color:var(--tx);text-align:left;padding:0 8px;white-space:nowrap;cursor:default;font-weight:400}.heat th{font-size:10.5px;padding:4px}
#ov{position:fixed;inset:0;background:#000a;z-index:40;display:none}#dr{position:fixed;top:0;right:-760px;width:min(740px,100vw);height:100%;background:var(--p1);border-left:2px solid var(--red);z-index:50;transition:right .25s;overflow:auto;padding:20px 22px 60px}
#dr.on{right:0}#ov.on{display:block}
#dr h1{font-size:20px;margin:6px 0 4px}#dr .kick{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--red2);font-weight:700}
#dr .x{position:absolute;right:14px;top:12px;background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:4px 10px;cursor:pointer}
.sec{margin:16px 0 6px;font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--mt);font-weight:700}
.box{background:var(--p1);border:1px solid var(--ln);border-radius:8px;padding:10px 12px}.box.calc{border-left:4px solid var(--amb);font-family:Consolas,monospace;font-size:12.5px}.box.fix{border-left:4px solid var(--grn)}.box.why{border-left:4px solid var(--blu)}
.calc div{padding:2px 0}.calc .tot{color:var(--tx);font-weight:700;border-top:1px dashed #555;margin-top:4px;padding-top:5px}
.pri{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center}.pri .no{width:30px;height:30px;border-radius:50%;background:var(--c,var(--red));color:#000;font-weight:800;display:grid;place-items:center}
.pri b{display:block}.pri span{color:var(--mt);font-size:12.5px}
.step{display:grid;grid-template-columns:auto 1fr;gap:10px;margin:6px 0}.step b{color:var(--grn)}
.card .note,main .note{display:none}#dr .note{display:block}.note{font-size:11.5px;color:var(--mt);border-left:3px solid var(--ln);padding-left:9px;margin-top:8px}
.ok{color:var(--grn)}.bad{color:var(--red2)}.warn{color:var(--amb)}
@media(max-width:700px){.g2{grid-template-columns:1fr}.hb{grid-template-columns:110px 1fr 70px}header{padding:8px 10px}nav button{padding:6px 8px;font-size:12px}main{padding:12px}}
</style></head><body>

function donut(parts,o={}){const R=o.r||70,r=R-22,c=R+4,T=parts.reduce((a,p)=>a+p.v,0);let a0=-Math.PI/2,s=`<svg viewBox="0 0 ${2*c} ${2*c}" width="${o.w||200}">`;
  parts.forEach(p=>{const a1=a0+2*Math.PI*p.v/T,l=a1-a0>Math.PI?1:0;const P=(a,rr)=>[c+rr*Math.cos(a),c+rr*Math.sin(a)];const [x0,y0]=P(a0,R),[x1,y1]=P(a1-.001,R),[x2,y2]=P(a1-.001,r),[x3,y3]=P(a0,r);
    s+=`<path class="pt" d="M${x0},${y0}A${R},${R} 0 ${l} 1 ${x1},${y1}L${x2},${y2}A${r},${r} 0 ${l} 0 ${x3},${y3}Z" fill="${p.c}" onclick="CL[${reg(p.fn||(()=>{}))}]()"><title>${esc(p.l)}: ${f0(p.v)}</title></path>`;a0=a1});
  s+=`<text x="${c}" y="${c-2}" text-anchor="middle" style="fill:var(--tx);font-size:20px;font-weight:800">${o.center||''}</text><text x="${c}" y="${c+14}" text-anchor="middle" style="font-size:10px">${o.sub||''}</text></svg>`;
  return `<div class="donutw">${s}<div>${parts.map(p=>`<div style="cursor:pointer;margin:4px 0" onclick="CL[${reg(p.fn||(()=>{}))}]()"><span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:${p.c};margin-right:7px"></span>${esc(p.l)} <b>${f0(p.v)}</b> <span style="color:var(--mt)">${pc(p.v/T)}</span></div>`).join('')}</div></div>`}
function pairbars(items){ // {label,need,have,fn}
  const mx=Math.max(...items.map(i=>Math.max(i.need,i.have)));
  return items.map(i=>{const short=i.need>i.have;return `<div class="row2" onclick="CL[${reg(i.fn)}]()"><div>${esc(i.label)}</div><div class="pb" title="Needed ${f0(i.need)} · Present ${f0(i.have)}"><i style="width:${i.need/mx*100}%;border:1px dashed var(--tx);background:transparent"></i><i style="width:${i.have/mx*100}%;background:${short?COL.red:COL.grn};opacity:.85"></i><b>${f0(i.have)} / ${f0(i.need)} ${short?'▼ −'+f0(i.need-i.have):'▲ +'+f0(i.have-i.need)}</b></div></div>`}).join('')}

  const rows=o.rows.filter(x=>x.mdreq>0&&x.gross>0).map(x=>({...x,loss:x.gross-x.act})).sort((a,b)=>b.loss-a.loss).slice(0,15);
  openDr({kick:MONF[m]+' 2026 · Monthly MIS',title:`${MONF[m]}: reported ${pc(o.adj,1)} vs true ${pc(o.raw,1)} achievement`,tag:'Hidden productivity loss',
  what:`The MIS shows <b>"Achievement with adjustment"</b> ≈ ${pc(o.adj,1)} because mandays that were moved to other work (rework, sorting, shortages, medical etc.) are <b>removed from the denominator</b>. The honest figure is <b>raw achievement = manpower required for output ÷ gross mandays paid</b> = ${pc(o.raw,1)}. The gap is paid labour that produced nothing for the department's own output.`,
  calc:[['Manpower required for actual output (Σ MD req)',f0(o.mdreq)],['Gross mandays paid (Σ)',f0(o.gross)],['Mandays removed as adjustment/ non-productive (Gross − Actual)',f0(o.np)],['   of which Lent-to-Non-LTS (lent-out)',f0(o.l2n)],['   of which 60&80 + T&D',f0(o.sixty+o.td)],['   of which Breakdown',f0(o.bd)],[`Reported achievement = ${f0(o.mdreq)} ÷ ${f0(o.act)}`,pc(o.adj,1)],[`True achievement = ${f0(o.mdreq)} ÷ ${f0(o.gross)}`,pc(o.raw,1),1],[`Indicative cost of non-productive mandays: ${f0(o.np)} × ₹${COST}`,rs(o.np*COST)]],
  table:{title:'Departments with the biggest gap between gross and actual mandays',head:['Department','Gross MD','Actual MD','Gap MD','Raw ach.','Adj ach.'],rows:rows.map(x=>[esc(x.dept),f0(x.gross),f0(x.act),f0(x.loss),`<span style="color:${colR(x.achRaw)}">${pc(x.achRaw)}</span>`,pc(x.achAdj)])},
  fix:['Report <b>raw achievement</b> next to the adjusted figure in the daily/monthly MIS so loss is visible.','Give every adjustment a reason code and owner (see Root Causes) and review the top 3 reasons weekly.','Set a target: non-productive mandays ≤ 5% of gross (today '+pc(o.np/o.gross,1)+').'],
  links:[['Why mandays are lent out',()=>tabGo(5)],['Effect on people gap',()=>tabGo(7)],['Action plan',()=>tabGo(6)]],

/* ---- Root causes ---- */
function classify(t){t=(t||'').toLowerCase();if(!t.trim())return'Not stated';
  if(/shortage|short |not (received|available|issued)|awaiting|pending|material|supply|stock|missing|no kit|kit not/.test(t))return'Material / supply';
  if(/machine|breakdown|\bbd\b|maint|conveyor|oven|power|compressor|die |tool|jig|fixture|line stop/.test(t))return'Machine / breakdown';
  if(/reject|rework|quality|defect|scratch|rust|dent/.test(t))return'Quality / rework';
  if(/absent|manpower|man power|labou?r|skill|worker|attendance|leave/.test(t))return'Manpower';
  if(/plan|model|changeover|change over|sorting|no order|mix|trial|sample/.test(t))return'Planning / changeover';
  return'Other';}
function ddBucket(m,b){const rows=TR[m].filter(t=>t.bucket===b).sort((a,c)=>c.days-a.days);const tot=sum(rows,r=>r.days);
  openDr({kick:'MD Adjustment ledger · '+MONF[m],title:b,tag:BKMETA[b][0],tagc:BKMETA[b][1],what:`Mandays that were <b>moved out of the department</b> to do this work. The department still pays them, but they add nothing to its own output — so they are the hidden cost behind the "≈100% adjusted" figure.`,
  calc:[['Mandays in this bucket',f1(tot)],['Share of all transfers in '+m,pc(tot/sum(TR[m],t=>t.days),1)],[`Indicative cost = ${f1(tot)} × ₹${COST}`,rs(tot*COST),1]],
  table:{title:'Reasons & departments',head:['Reason','Sending dept','Mandays'],rows:rows.slice(0,25).map(r=>[esc(r.reason),esc(r.dept),f1(r.days)])},
  fix:b==='Material shortage'?['PPC to run a material-availability check 48 h before each plan day (kitting sign-off).','Re-sequence the plan to run models whose full kit is available; never release manpower plans for models without kit.','Track every shortage with item code and supplier; escalate repeat items.']:b.startsWith('Sorting')?['Segregate frames/boxes model-wise at source (supplier/previous process) instead of re-sorting later.','Add model-wise bins/FIFO lanes at the end of upstream departments.']:b.startsWith('Rework')?['Do root-cause (Pareto) on each rework type — paint, rust, box, guard.','Charge rework mandays to the originating department so ownership is clear.','Set a rework-manday target per month and review weekly.']:['Plan these activities in the weekly roster (low-load days) instead of pulling production staff ad-hoc.','Keep a standing small crew for the activity so production lines are not disturbed.']});}
function tCause(){
  const mk=m=>{const b=trBucket(m);const tot=sum(Object.values(b),x=>x);return hbars(Object.entries(b).sort((a,c)=>c[1]-a[1]).map(([k,v])=>({label:k,value:v,color:BKMETA[k][1],txt:f0(v)+' · '+pc(v/tot),fn:()=>ddBucket(m,k)})))};
  const b8=trBucket('Aug'),b9=trBucket('Sep');const avo=b=>(b['Material shortage']||0)+(b['Sorting / model-wise segregation']||0)+(b['Rework & rectification']||0);
  const l2=M.Sep.rows.filter(x=>x.l2n>0).sort((a,b)=>b.l2n-a.l2n).slice(0,10);
  const cls={};rowsLow.forEach(r=>{const c=classify(r.reason);(cls[c]=cls[c]||[]).push(r)});
  const cl=Object.entries(cls).sort((a,b)=>b[1].length-a[1].length);
  const rsn=D.transfers.Sep.concat(D.transfers.Aug.map(x=>({...x,m:'Aug'}))).length;
  return `<h2>Why are mandays being lost? — root causes</h2><p class="how"><b>How to read:</b> when a department lends people to other work, the "MD Adjustment" ledger records why. Reasons are grouped into buckets: <b style="color:${COL.red}">avoidable</b> (shortage, sorting, rework), <b style="color:${COL.blu}">plannable</b> (kit movement, 5S), and statutory/process. The ledger totals reconcile exactly to the lent-out column of the monthly MIS (Aug ${f1(sum(TR.Aug,t=>t.days))}, Sep ${f1(sum(TR.Sep,t=>t.days))}).</p>
  <div class="grid g2"><div class="card"><h3>August — ${f0(sum(TR.Aug,t=>t.days))} mandays moved</h3><div class="sub">Avoidable: ${f0(avo(b8))} (${pc(avo(b8)/sum(TR.Aug,t=>t.days))}). Click a bucket.</div>${mk('Aug')}</div><div class="card"><h3>September — ${f0(sum(TR.Sep,t=>t.days))} mandays moved</h3><div class="sub">Avoidable: ${f0(avo(b9))} (${pc(avo(b9)/sum(TR.Sep,t=>t.days))}). Click a bucket.</div>${mk('Sep')}</div></div>
  <h2>Departments that lend out the most people — Sep</h2><p class="how">lent-out = mandays lent to non-LTS work. Click for the department's full picture.</p><div class="card">${hbars(l2.map(x=>({label:x.dept,value:x.l2n,color:COL.red,txt:f0(x.l2n)+' MD · '+rs(x.l2n*COST),fn:()=>{const t=D.transfers.Sep.filter(z=>z.dept.toLowerCase().replace(/[^a-z0-9]/g,'')===x.dept.toLowerCase().replace(/[^a-z0-9]/g,''));ddPoints(x.dept+' — mandays lent out (Sep)',`${f0(x.l2n)} mandays × ₹${COST} ≈ ${rs(x.l2n*COST)}. True achievement ${pc(x.achRaw)} vs reported ${pc(x.achAdj)}.`,{head:['Reason','Mandays'],rows:t.sort((a,b)=>b.days-a.days).map(z=>[esc(z.reason),f1(z.days)])})}})))}</div>
  <h2>What do shop-floor remarks say? (days below 80% of norm)</h2><p class="how">Reasons typed in the daily productivity report on low days were grouped by keyword. "Not stated" means no reason was recorded — itself a gap in discipline. Click a group to read the actual remarks.</p>
  <div class="card">${hbars(cl.map(([k,v])=>({label:k,value:v.length,color:k==='Not stated'?COL.gr:COL.amb,txt:v.length+' dept-days',fn:()=>ddPoints('Low days — '+k,`${v.length} dept-days below 80% of norm with remarks classified as "${k}".`,{head:['Date','Department','vs norm','Remark'],rows:v.sort((a,b)=>a.ratio-b.ratio).slice(0,40).map(r=>[dlab(r.d),esc(r.dept),pc(r.ratio),`<span style="font-size:11px">${esc((r.reason||'—').slice(0,120))}</span>`])})})))}<div class="note">${rowsLow.length} dept-days below 80% of norm across 19 daily reports. Keyword grouping is indicative.</div></div>`;
}

function ddAction(i){const a=actions()[i];openDr({kick:'Action '+a.id+' · '+a.cat,title:a.t,tag:a.sev==='H'?'High priority':a.sev==='M'?'Medium':'Watch',tagc:sevc[a.sev],what:`<b>Problem:</b> ${a.problem}<br><br><b>Why this action:</b> ${a.why}`,calc:a.calc,table:a.table,fix:a.fix,links:[['Open related view',()=>tabGo(a.tab)],['Back to overview',()=>tabGo(0)]],benefit:a.benefit+`<br><span style="color:var(--mt)">Owner: ${a.owner} · KPI: ${a.kpi}</span>`,note:`Cost basis: ₹${COST}/manday = Sep straight-time value ÷ Overtime mandays (Overtime file). Indicative, not payroll cost.`});}
